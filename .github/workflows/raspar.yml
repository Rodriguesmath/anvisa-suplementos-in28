name: Atualizar dados do painel Anvisa

on:
  workflow_dispatch:

jobs:
  raspar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python src/raspar.py

      - name: Commitar dados atualizados (se houver mudança)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: atualiza dados do painel Anvisa"
          git push
